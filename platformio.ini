; ESP32-CAM + 1.8" ST7735S TFT + GY-GPSV3-NEO GPS receiver
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; FTDI USB-TTL detected on this machine (USB VID:PID=0403:6001)
upload_port = COM5
monitor_port = COM5

; GPIO2 is the camera LED / strapping pin: it flickers as MOSI, that is normal.
; No PSRAM on the AI-CAM module, so it stays disabled.
build_flags =
	-DLGFX_USE_V1=1
	-O2

lib_deps =
	lovyan03/LovyanGFX@^1.2.0
	mikalhart/TinyGPSPlus@^1.1.0
